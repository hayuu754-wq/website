<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak - Muhammad Ilham Aulia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0F172A',
                        darkCard: '#1E293B',
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-darkBg dark:text-slate-100 transition-colors duration-300 min-h-screen flex flex-col font-sans">

    <header class="sticky top-0 z-40 bg-white/80 dark:bg-darkBg/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="index.html" class="text-xl font-bold bg-gradient-to-r from-blue-600 to-indigo-500 bg-clip-text text-transparent">
               Muhammad Ilham Aulia<span class="text-blue-500">.</span>
            </a>
            
            <nav class="hidden md:flex items-center gap-6 text-sm font-medium">
                <a href="index.html" class="hover:text-blue-600 dark:hover:text-blue-400 transition-colors">Tentang</a>
                <a href="artikel.html" class="hover:text-blue-600 dark:hover:text-blue-400 transition-colors">Artikel</a>
                <a href="kontak.html" class="text-blue-600 dark:text-blue-400 font-semibold border-b-2 border-blue-600 dark:border-blue-400 pb-0.5">Kontak</a>
            </nav>

            <button id="themeToggle" class="p-2 rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300">
                <i data-lucide="moon" class="w-5 h-5 hidden dark:block"></i>
                <i data-lucide="sun" class="w-5 h-5 block dark:hidden"></i>
            </button>
        </div>
    </header>

    <main class="py-12 flex-grow">
        <div class="max-w-3xl mx-auto px-4 sm:px-6">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold">Hubungi Saya</h1>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-2">Ingin berdiskusi atau berteman? Anda bisa menghubungi saya melalui sosial media atau form di bawah ini.</p>
            </div>

            <div class="mb-8 grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="bg-white dark:bg-darkCard p-5 rounded-xl border border-slate-200 dark:border-slate-800 flex items-center gap-4">
                    <div class="p-3 bg-pink-100 dark:bg-pink-900/30 text-pink-600 dark:text-pink-400 rounded-lg">
                        <i data-lucide="instagram" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <p class="text-xs text-slate-500 dark:text-slate-400">Instagram</p>
                        <a href="https://instagram.com/ilhmseishiroo" target="_blank" class="font-semibold text-blue-600 dark:text-blue-400 hover:underline">@ilhmseishiroo</a>
                    </div>
                </div>

                <div class="bg-white dark:bg-darkCard p-5 rounded-xl border border-slate-200 dark:border-slate-800 flex items-center gap-4">
                    <div class="p-3 bg-blue-100 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 rounded-lg">
                        <i data-lucide="school" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <p class="text-xs text-slate-500 dark:text-slate-400">Sekolah / Kelas</p>
                        <p class="font-semibold text-sm">SMK 3 PERGURUAN CIKINI (XII TKJ B)</p>
                    </div>
                </div>
            </div>

            <form onsubmit="handleContact(event)" class="space-y-4 bg-white dark:bg-darkCard p-6 sm:p-8 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium mb-1">Nama</label>
                        <input type="text" required placeholder="Nama Anda" class="w-full px-3 py-2 rounded-lg text-sm border border-slate-200 dark:border-slate-700 bg-transparent focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium mb-1">Email</label>
                        <input type="email" required placeholder="email@contoh.com" class="w-full px-3 py-2 rounded-lg text-sm border border-slate-200 dark:border-slate-700 bg-transparent focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium mb-1">Pesan</label>
                    <textarea rows="4" required placeholder="Tuliskan pesan Anda..." class="w-full px-3 py-2 rounded-lg text-sm border border-slate-200 dark:border-slate-700 bg-transparent focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>
                <button type="submit" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-lg transition-colors flex items-center justify-center gap-2">
                    <i data-lucide="send" class="w-4 h-4"></i> Kirim Pesan
                </button>
            </form>
        </div>
    </main>

    <footer class="border-t border-slate-200 dark:border-slate-800 py-6 bg-white dark:bg-darkBg">
        <div class="max-w-5xl mx-auto px-4 text-center text-xs text-slate-500 dark:text-slate-400">
            <p>©Muhammad Ilham Aulia • SMK 3 Perguruan Cikini</p>
        </div>
    </footer>

    <script>
        lucide.createIcons();
        document.getElementById('themeToggle').addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
        });

        function handleContact(e) {
            e.preventDefault();
            alert('Terima kasih! Pesan Anda telah terkirim.');
            e.target.reset();
        }
    </script>
</body>
</html>
